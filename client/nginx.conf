server {
  # Listen on both common PaaS ports so Railway's domain/healthcheck hits
  # nginx whichever target port it chose (80 default for Docker, 8080 fallback).
  listen 80;
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Service worker must never be cached by the CDN/browser cache.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # SPA fallback: every non-file route serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
