server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Service worker must never be cached by the CDN/browser cache.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # SPA fallback: every non-file route serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
