# Render.com free-tier deployment definition for the Executive PA API.
# Providers are replaceable by design (Phase 7 rule): this file is declarative
# infrastructure config, not business logic. If Render's free tier changes,
# redeploy the same Node app on any equivalent host (Fly.io, Railway trial,
# Koyeb, etc.) using the same environment variables.
#
# Free-tier note (verify at deploy time): Render free web services sleep after
# ~15 min idle and wake on the next request; the in-process reminder scheduler
# only ticks while awake. This is acceptable for personal use - see docs/DEPLOYMENT.md.
#
# Expected health check path: /api/ready
services:
  - type: web
    name: executive-pa-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci && npx prisma generate
    startCommand: node src/index.js
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # set to your MongoDB Atlas connection string (mongodb+srv://...)
      - key: JWT_SECRET
        generateValue: true
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_TENANT_ID
        sync: false
      - key: ALLOWED_USER_EMAIL
        sync: false
      - key: CLIENT_URL
        sync: false   # e.g. https://executive-pa.netlify.app
      - key: SERVER_URL
        sync: false   # e.g. https://executive-pa-api.onrender.com
